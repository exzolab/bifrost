---
- name: Ensure Bifrost wg-easy directory exists
  ansible.builtin.file:
    path: "{{ bifrost_root }}/wg-easy"
    state: directory
    mode: "0755"

- name: Render Bifrost client sing-box config
  ansible.builtin.template:
    src: "client/config.json.j2"
    dest: "{{ bifrost_root }}/sing-box/config.json"
    mode: "0644"
  notify: "restart bifrost"

- name: Render Bifrost client WireGuard hooks
  ansible.builtin.template:
    src: "client/wg-hooks.sh.j2"
    dest: "{{ bifrost_root }}/wg-easy/hooks.sh"
    mode: "0755"

- name: Render Bifrost client compose config
  ansible.builtin.template:
    src: "client/compose.yml.j2"
    dest: "{{ bifrost_root }}/compose.yml"
    mode: "0644"
